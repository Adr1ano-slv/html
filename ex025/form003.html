<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formullário</title>
</head>
<body>
       <h1>Testa formulários</h1>
       <form action="cadastro.php">
        <p>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Digite seu nome" size="30" autocomplete="on">
        </p>

        <p>
        <label for="medida">Medida:</label>
        <input type="number" name="medida" id="imedida" required min="0" max="10" step="0.1" placeholder="0 a 10">
        </p>
        <label for="mes">Mês:</label>
        <input type="month" name="mes" id="imes" required value="2004-05" min="2000-01" max="2024-12">

        <p>
            <input type="submit" value="Enviar" >
            <input type="reset" value="Limpar" >
       </form>
</body>
</html>
