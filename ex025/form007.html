<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplos de formulários</h1>
    <form action="cadastro.php" method="POST" autocapitalize="on">
    <p>
        <label for="iest"> estado</label>
        <select name="estado" id="iest">
            <option value=""select>----Escolha----</option>
            <optgroup value="Região Nordeste">
                 <option value="PE">Penambuco</option>
                 <option value="PA"> Pará</option>
            </optgroup>
                
            <optgroup value="Região Sudeste">
                <option value="PR">Paraná</option>
                <option value="MS"> Mato Grosso do Sul</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="SP">São paulo</option>
            </optgroup>
        </select>

    </p>

    <p>
        <label for="ifrof"> Profissão: </label>
        <input type="text" name="iprof" id="iprof" list="lisprof">
        <datalist id="lisprof">
            <option> Adiministrador</option>
            <option> contavilista</option>
            <option> progragamdor</option>
            <option> Programador</option>
            <option> Professor</option>
        </datalist>
    </p>
    <p>
        <label for="imsg">Mensagem:</label><br>
        <textarea name="msg" id="imsg" cols="30" rows="10"></textarea> 
    </p>
      

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
    
</body>
</html>
