<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelelas</title>
    <style>
       body{
         font-family: Arial, Helvetica, sans-serif;


        }

        table {
            border-collapse: collapse;
            width: 500px;
        }
        td, th {
            border: 1px solid #080808;
            padding: 20px;

        }
        thead, tfoot{
            background-color: #40836a6e;
            color: white;
        }
        td.number{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas</h1>
    <!-- anatomia para tabelas grandes
      TABLE = Tabela
        TH = Cabeçalho
        TR = Linha
        TD = Dado
        TFOOT = Rodapé
        THEAD
        TR, TD, TH
        TBODY
        TR, TD, TH
        TFOOT
        TR, TD, TH
    -->
    <table>
        <thead>
            <tr>
                <th>estado</th>
                <th>população</th>
                <th>% por população</th>
            </tr>

        </thead>

        <tbody>
            <tr>
                <td>São paulo</td>
                <td class="number">46 081 801 </td>
                <td>7,63%</td>
            </tr>

            <tr>
                <td>Minas Gerais</td>
                <td class="number">21 393 441</td>
                <td>4,81%</td>
            </tr>

            <tr>
                <td>Rio de Janeiro</td>
                <td class="number">17 223 547</td>
                <td>0,41%</td>
            </tr>

            <tr>
                <td>Bahia</td>
                <td class="number">14 870 907</td>
                <td>0,89%</td>
            </tr>

            <tr>
                <td>Paraná</td>
                <td class="number">11 890 517</td>
                <td>0,97%</td>
            </tr>

            <tr>
                <td>Rio Grande do Sul</td>
                <td class="number">11 233 263</td>
                <td>177%</td>
            </tr>

            <tr>
                <td>Pernambuco</td>
                <td class="number">9 562 007</td>
                <td>2,98%</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <th>população total</th>
                <td><strong>00000000</strong></td>
                <td>100%</td>
            </tr>

        </tfoot>
    </table>
</body>
</html>
