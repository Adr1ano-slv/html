<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            
                
            


        }

        div.item {
            background-color: lightblue;
            border: 1px solid rgb(0, 0, 12);
            flex-basis: 150px;

            text-align: center;
         
            
        }
    </style>
</head>
<body>
    <div class="container">

    
    <div class="item">essa mensagem</div>
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">As vezes pode ser grande</div>
    <div class="item">E</div>
    <div class="item">Ou maior ainda que você pensa aqui </div>
    <div class="item">G</div>
    </div>
</body>
</html>
