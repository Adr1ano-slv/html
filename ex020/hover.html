<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de houver</title>
    <style>
body {
    font-family: 'Courier New', Courier, monospace;
}
div > p {
    display: none;
}
div:hover > p {
    display: block;
    color: white;
    background-color: red;
}

div:hover{
    color: red;;
}
</style>
</head>
<body>
    <h1>Passe o mouse sobre o texto abaixo</h1>
    <div
    >Passe o mouse aqui
    <p>TEXTO ESCONDIDO....</p>
    </div>
    <p>fim do exemplo.</p>
</body>
</html>
