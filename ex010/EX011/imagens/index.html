<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mideias em html5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em varios dispositivos 
        diferentes ou simplesmente aumente ou diminua o 
        tamanho do seu navegador
        <picture>
            <source media="(max-width: 750)" srcset="imagens/imagem-p.png" type="image/png">
            <source media="(max-width: 1050)" srcset="imagens/imagem-m.png" type="image/png">
            <img src="imagem-g.png" alt="imagens-flexcivel">
        </picture>
</p>
</body>
</html>
